name: Daily paper digest

on:
  schedule:
    # 01:00 UTC = 09:00 Asia/Shanghai. GitHub may delay scheduled runs.
    - cron: '0 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'digest.py'
      - 'test_digest.py'
      - 'config.json'
      - '.github/workflows/daily.yml'

concurrency:
  group: paper-digest-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Validate generator
        run: python3 -m unittest -v
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Set public article links
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('config.json')
          config = json.loads(path.read_text())
          config['public_base_url'] = os.environ['PAGES_BASE_URL']
          path.write_text(json.dumps(config, ensure_ascii=False, indent=2))
          PY
      - name: Generate today's digest
        run: python3 digest.py
      - name: Validate RSS
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('public/feed.xml')
          items = root.findall('channel/item')
          assert items, 'RSS has no entries'
          guids = [item.findtext('guid') for item in items]
          assert len(guids) == len(set(guids)), 'Duplicate daily entries'
          assert items[0].findtext('link').startswith('https://')
          print(f'Validated {len(items)} daily entries')
          PY
      - name: Save public research history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public state/digests state/snapshots
          if ! git diff --cached --quiet; then
            git commit -m 'Update daily paper digest'
            git push origin HEAD:main
          fi
      - name: Upload RSS and articles
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
