name: Daily paper digest

on:
  schedule:
    # 01:00 UTC = 09:00 Asia/Shanghai. GitHub may delay scheduled runs.
    - cron: '0 1 * * *'
    # Fallback retry if the first scheduled run is delayed or fails.
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      regenerate:
        description: Regenerate today's digest with the same RSS GUID
        type: boolean
        default: false
      summaries_only:
        description: Refresh summaries for today's existing selection
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'digest.py'
      - 'test_digest.py'
      - 'personalization.py'
      - 'test_personalization.py'
      - 'summarization.py'
      - 'test_summarization.py'
      - 'requirements-personalization.txt'
      - 'config.json'
      - '.github/workflows/daily.yml'

concurrency:
  group: paper-digest-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Validate generator
        run: python3 -m unittest -v
      - name: Check personalization configuration
        id: zotero
        env:
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
        run: |
          if [ -n "$ZOTERO_KEY" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Install CPU similarity model dependencies
        continue-on-error: true
        if: steps.zotero.outputs.enabled == 'true' && inputs.summaries_only != true
        run: |
          python3 -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install -r requirements-personalization.txt
      - name: Verify Zotero library
        if: steps.zotero.outputs.enabled == 'true' && github.event_name == 'workflow_dispatch' && inputs.summaries_only != true
        env:
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_COLLECTIONS: ${{ secrets.ZOTERO_COLLECTIONS }}
        run: python3 personalization.py --check
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Set public article links
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('config.json')
          config = json.loads(path.read_text())
          config['public_base_url'] = os.environ['PAGES_BASE_URL']
          path.write_text(json.dumps(config, ensure_ascii=False, indent=2))
          PY
      - name: Generate today's digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUMMARIES_ONLY: ${{ inputs.summaries_only }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_COLLECTIONS: ${{ secrets.ZOTERO_COLLECTIONS }}
          REGENERATE: ${{ inputs.regenerate }}
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          if [ "$SUMMARIES_ONLY" = 'true' ]; then
            python3 digest.py --refresh-summaries
          elif [ "$REGENERATE" = 'true' ]; then
            python3 digest.py --force
          else
            python3 digest.py
          fi
      - name: Validate RSS
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('public/feed.xml')
          items = root.findall('channel/item')
          assert items, 'RSS has no entries'
          guids = [item.findtext('guid') for item in items]
          assert len(guids) == len(set(guids)), 'Duplicate daily entries'
          assert items[0].findtext('link').startswith('https://')
          print(f'Validated {len(items)} daily entries')
          PY
      - name: Save public research history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public state/digests state/snapshots
          if [ -d state/new-digests ]; then git add state/new-digests; fi
          if [ -d state/summaries ]; then git add state/summaries; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Update daily paper digest'
            git push origin HEAD:main
          fi
      - name: Upload RSS and articles
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
